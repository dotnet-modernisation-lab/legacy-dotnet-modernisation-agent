<text x="270" y="1008" font-size="12" font-weight="normal" fill="#6b7a8d">Relative effort, not days. Low confidence: the size rests on unassessed technology or on decisions not yet made. No overall estate size is given.</text>
<text x="40" y="1034" font-size="12" font-weight="normal" fill="#6b7a8d">People and callers are deduced from what each project is (a website has browser users). Who they are and where they connect from cannot be seen in a repository.</text>
<text x="40" y="1054" font-size="12" font-weight="normal" fill="#6b7a8d">Blue tags show what the code and configuration declare about access, not what is enforced at run time.</text>
